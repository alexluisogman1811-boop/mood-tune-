# Continuous integration for MoodScape.
#
# - analyze-and-test (Linux): flutter analyze + all unit/widget tests.
# - ios-build (macOS): compiles the iOS app without code signing, which also
#   compiles the Swift MusicKit bridge in ios/Runner/AppDelegate.swift.
#   Installing on an iPhone additionally needs an Apple Developer account
#   and signing; this job only proves the iOS project builds.
#
# Private repositories spend GitHub Actions minutes; macOS minutes count 10x.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  ios-build:
    name: iOS build (no code signing)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --debug --no-codesign
