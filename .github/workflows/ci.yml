# Continuous integration for MoodScape.
#
# - analyze-and-test (Linux): flutter analyze + all unit/widget tests.
# - ios-build (macOS): compiles the iOS app without code signing, which also
#   compiles the Swift MusicKit bridge in ios/Runner/AppDelegate.swift.
#   Installing on an iPhone additionally needs an Apple Developer account
#   and signing; this job only proves the iOS project builds.
# - android-e2e (Linux): runs integration_test/app_flow_test.dart on an
#   Android API 34 emulator, driving the real app end to end.
#
# Private repositories spend GitHub Actions minutes; macOS minutes count 10x.
name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes don't need a build (saves CI minutes).
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  ios-build:
    name: iOS build (no code signing)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      # Release mode: iOS won't launch Flutter debug builds from the home
      # screen. Unsigned, so it also proves the project compiles.
      - name: Build iOS app (release, unsigned)
        run: flutter build ios --release --no-codesign

      # An .ipa is a zip of Payload/Runner.app. Unsigned, it can be
      # sideloaded with AltStore or Sideloadly, which sign it with the
      # user's own (free) Apple ID. See README › iPhone without paying.
      - name: Package unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry ../MoodScape-unsigned.ipa Payload
          ls -lh ../MoodScape-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v7
        with:
          name: MoodScape-unsigned-ipa
          path: build/MoodScape-unsigned.ipa
          if-no-files-found: error
          # Short retention keeps storage within the free allowance.
          retention-days: 7

  android-e2e:
    name: Android end-to-end test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration_test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test -d emulator-5554
